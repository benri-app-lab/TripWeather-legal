<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWeather - 法的文書</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background-color: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .link-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, box-shadow 0.2s;
            display: block;
        }

        .link-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .link-card h2 {
            margin: 0 0 10px 0;
            font-size: 1.3em;
        }

        .link-card p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9em;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌤️ TripWeather</h1>
        <p class="subtitle">法的文書・規約</p>

        <p>TripWeatherをご利用いただき、ありがとうございます。以下の文書をご確認ください。</p>

        <div class="links">
            <a href="privacy_policy.html" class="link-card">
                <h2>📄 プライバシーポリシー</h2>
                <p>個人情報の取り扱いについて</p>
            </a>

            <a href="terms_of_service.html" class="link-card">
                <h2>📋 利用規約</h2>
                <p>サービス利用の条件について</p>
            </a>
        </div>

        <div class="footer">
            <p>最終更新日: 2026年1月19日</p>
            <p>お問い合わせ: apptripweather@gmail.com</p>
        </div>
    </div>
</body>

</html>
